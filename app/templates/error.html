<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ error_code }} —
        {{ title|default('ResourceHub') }}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="
        bg-gray-50
        min-h-screen
    "
>

    <div
        class="
            min-h-screen
            flex
            items-center
            justify-center
            px-6
        "
    >

        <div
            class="
                max-w-md
                w-full
                text-center
            "
        >


            <!-- ERROR CODE -->

            <div
                class="
                    text-7xl
                    font-bold
                    text-blue-600
                "
            >
                {{ error_code }}
            </div>


            <!-- TITLE -->

            <h1
                class="
                    mt-4
                    text-2xl
                    font-semibold
                    text-gray-900
                "
            >

                {{ title|default(
                    'Something went wrong'
                ) }}

            </h1>


            <!-- MESSAGE -->

            <p
                class="
                    mt-3
                    text-gray-600
                "
            >

                {{ message }}

            </p>


            <!-- ACTIONS -->

            <div
                class="
                    mt-8
                    flex
                    flex-col
                    sm:flex-row
                    justify-center
                    gap-3
                "
            >

                <a
                    href="{{ url_for(
                        'dashboard.dashboard'
                    ) }}"

                    class="
                        inline-block
                        px-6
                        py-3
                        bg-blue-600
                        text-white
                        rounded-lg
                        hover:bg-blue-700
                        transition
                    "
                >

                    Back to Dashboard

                </a>


                <button
                    type="button"

                    onclick="history.back()"

                    class="
                        inline-block
                        px-6
                        py-3
                        bg-gray-100
                        text-gray-700
                        rounded-lg
                        hover:bg-gray-200
                        transition
                    "
                >

                    Go Back

                </button>

            </div>

        </div>

    </div>

</body>

</html>
